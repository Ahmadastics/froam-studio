name: CI

# Every branch a release is cut from, every tag, every pull request — on the
# three systems people run `npx @ahmadastic/froam` on. 9.5.0 shipped a CLI
# that could not start on Linux or macOS; it passed on Windows, and CI only
# ran on main, which releases are not made from.
on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # One known Chrome on every runner; the browser tests read its path.
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - run: npm ci
      - run: npm run build
      # Each suite's output is kept so that, if it fails, its last lines become
      # an annotation on the run page instead of something to dig out of logs.
      - name: Unit tests
        id: unit
        shell: bash
        run: set -o pipefail; npm test 2>&1 | tee "$RUNNER_TEMP/unit.log"
      - if: failure() && steps.unit.outcome == 'failure'
        run: node scripts/ci-annotate.mjs "Unit tests on ${{ matrix.os }}" "${{ runner.temp }}/unit.log"
      - name: Browser tests (real Chrome against the real CLI)
        id: e2e
        shell: bash
        run: set -o pipefail; npm run test:e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"
        env:
          FROAM_E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - if: failure() && steps.e2e.outcome == 'failure'
        run: node scripts/ci-annotate.mjs "Browser tests on ${{ matrix.os }}" "${{ runner.temp }}/e2e.log"
      # The way people really start it: installed from a packed tarball and
      # run through npm's bin link, so the #! line has to work.
      - name: The packed CLI starts the way npx starts it
        shell: bash
        run: |
          TARBALL="$(npm pack --silent | tail -1)"
          mkdir -p "$RUNNER_TEMP/npx-check/site" && cd "$RUNNER_TEMP/npx-check"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$TARBALL"
          npx --no-install froam version
          cd site
          echo '<!doctype html><html><head></head><body><h1>Hi</h1></body></html>' > index.html
          npx --no-install froam init
          npx --no-install froam build
          npx --no-install froam doctor

  # The oldest Node still supported upstream: the unit tests and the CLI.
  node-22:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: set -o pipefail; npm test 2>&1 | tee "$RUNNER_TEMP/unit.log"
      - if: failure()
        run: node scripts/ci-annotate.mjs "Unit tests on Node 22" "${{ runner.temp }}/unit.log"
      - run: node bin/froam.mjs version
