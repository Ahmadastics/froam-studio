<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Froam e2e app fixture</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #0b1524; background: #f5f7fb; }
      #root { max-width: 960px; margin: 0 auto; padding: 96px 32px 48px; }
      h1 { font-size: 40px; margin: 0 0 12px; }
      .dialog { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(11, 21, 36, 0.35); z-index: 40; }
      .dialog__card { width: 360px; padding: 24px; border-radius: 16px; background: #fff; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.2); }
      .dialog__card h2 { margin: 0 0 8px; font-size: 22px; }
    </style>
  </head>
  <body>
    <div id="root">
      <h1 id="app-title">Acme dashboard</h1>
      <p id="app-copy">Welcome back. Three projects need review.</p>
    </div>
    <script>
      // What React's createPortal(…, document.body) does: the dialog lives on
      // <body>, beside #root, and closing it removes it from <body> directly —
      // which throws if anything moved it somewhere else.
      window.openDialog = function () {
        if (document.getElementById('dialog')) return
        var dialog = document.createElement('div')
        dialog.id = 'dialog'
        dialog.className = 'dialog'
        dialog.innerHTML = '<div class="dialog__card" role="dialog"><h2 id="dialog-title">Invite your team</h2><p id="dialog-text">Collaborate in real time.</p></div>'
        document.body.appendChild(dialog)
      }
      window.closeDialog = function () {
        var dialog = document.getElementById('dialog')
        if (dialog) document.body.removeChild(dialog)
      }
      setTimeout(window.openDialog, 800)
    </script>
  </body>
</html>
